  note: 'Works anonymously at the unauthenticated rate limit. Supply an API key via the Authorization:
    Bearer or X-LiFi-Api-Key header for the higher limit.'
  headers:
  - Authorization
  - X-LiFi-Api-Key
client_config:
  mcpServers:
