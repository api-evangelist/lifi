server:
  name: lifi
  transport: http
  url: https://mcp.li.quest/mcp
  docs: https://docs.li.fi/mcp-server/overview
  probe_status: 200
  read_only: true
  read_only_note: The server returns unsigned transactionRequest objects only. Signing and broadcast happen
