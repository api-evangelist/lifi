    configure: https://docs.li.fi/widget/configure-widget
    customize: https://docs.li.fi/widget/customize-widget
    layouts: https://docs.li.fi/widget/select-widget-layout
    events: https://docs.li.fi/widget/widget-events
    wallets: https://docs.li.fi/widget/wallet-management
    i18n: https://docs.li.fi/widget/internationalization
    compatibility: https://docs.li.fi/widget/compatibility
    polyfills: https://docs.li.fi/widget/polyfill-requirements
