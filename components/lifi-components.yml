summary: >-
  LI.FI ships a first-party embeddable UI layer — the LI.FI Widget — that drops a
  full cross-chain swap and bridge experience into a host application, plus a
  companion wallet-management library. These are client-side UI surfaces,
  distinct from the server-side routing SDK catalogued in packages/.
families:
- family: LI.FI Widget
  package: '@lifi/widget'
  version: 4.4.0
  loader: npm install @lifi/widget
  docs: https://docs.li.fi/widget/overview
  repository: https://github.com/lifinance/widget
  license: Apache-2.0
  playground: https://playground.li.fi
  description: >-
    Embeddable UI component for cross-chain swapping and bridging. Composer
    activates automatically when the destination is a vault or staking token.
  variants:
  - compact
  - wide
  - drawer
  capabilities:
  - Pre-configured themes with dark mode
  - Configurable allow/deny lists for chains, tokens, bridges and exchanges
  - Transaction progress and history views
  - Curated wallet lists and bookmarks
  - Full UI translations / internationalisation
  - Widget event hooks
  - Integrator fee monetisation
  frameworks:
  - React
  - Next.js
  - Vue
  - Nuxt.js
  - Svelte
  - Remix
  - Gatsby
  - Vite
  - Create React App
  - RainbowKit
  reference:
    api: https://docs.li.fi/widget/widget-api-reference
