notes: >-
  Derived from the $ref graph and id-reference fields across both specs (75
  schemas in the LI.FI API, 3 in the Earn API). LI.FI has no server-side
  persisted resources with opaque ids — there are no customers, orders or
  invoices to fetch by id. The domain is a routing graph: a Route decomposes
  into Steps, each Step carries an Action and an Estimate, and identity is
  carried by on-chain values (chain ids, token contract addresses, transaction
  hashes) rather than provider-issued object ids.
identity_model:
  provider_issued_ids: false
  id_prefixes: []
  natural_keys:
  - key: chainId
    description: Numeric EVM/non-EVM chain identifier (1 = Ethereum, 8453 = Base).
  - key: token address
    description: On-chain contract address; 0x0000...0000 denotes the native token.
  - key: txHash
    description: Source-chain transaction hash, the handle for status tracking.
  - key: integratorId
    description: Integrator string supplied by the caller for fee attribution.
  - key: tool key
    description: Stable string key identifying a bridge or exchange.
