                  id: a8dc011a-f52d-4492-9e99-21de64b5453a
                  type: lifi
                  tool: 1inch
                  toolDetails:
                    key: 1inch
                    logoURI: https://raw.githubusercontent.com/lifinance/types/main/src/assets/icons/exchanges/oneinch.svg
