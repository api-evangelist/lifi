                        chainId:
                          format: int32
                          type: integer
                        symbol:
                          type: string
                        decimals:
                          format: int32
                          type: integer
                        name:
                          type: string
                        coinKey:
                          type: string
                        logoURI:
                          type: string
                        priceUSD:
