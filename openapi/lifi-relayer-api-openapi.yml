      description: ''
      type: object
      properties:
        permitted:
          $ref: '#/components/schemas/PermittedTokenSchema'
          properties:
            token:
              type: string
            amount:
              type: string
        spender:
          type: string
        nonce:
          type: string
        deadline:
          format: int32
          type: integer
        witness:
          $ref: '#/components/schemas/RelayWitness'
          properties:
            diamondAddress:
              type: string
            diamondCalldataHash:
              type: string
      example:
        permitted:
          token: '0xc2132D05D31c914a87C6611C10748AEb04B58e8F'
          amount: '1000000'
        spender: '0x6307119078556Fc8aD77781DFC67df20d75FB4f9'
        nonce: '19'
        deadline: 1738149521625
        witness:
