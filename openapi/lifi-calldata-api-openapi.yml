openapi: 3.2.0
info:
  title: LI.FI Calldata API
  version: 1.0.0
  description: LI.FI provides the best cross-chain swap across all liquidity pools and bridges.
servers:
- url: https://li.quest
  description: LI.FI Production Environment
- url: https://staging.li.quest
  description: LI.FI Staging Environment
tags:
- name: Calldata
paths:
  /v1/calldata/parse:
    parameters:
    - name: chainId
      description: The chainId that the transaction is built for (or has been sent on)
      schema:
        type: string
      in: query
      required: false
    - name: callData
      description: The call data to parse
      schema:
        type: string
      in: query
      required: true
    get:
      parameters:
      - name: x-lifi-api-key
        description: Authentication header, register in the LI.FI Partner Portal (https://portal.li.fi/ ) to get your API Key.
        schema:
          type: string
        in: header
      responses:
        '200':
          $ref: '#/components/responses/ParsedCallDataResponse'
      summary: Parse transaction call data (BETA)
      description: This endpoint allows to pass transaction call data. It will then parse the call data based on known and on-chain ABIs to provide a JSON overview of the internal transaction information.
      tags:
      - Calldata
components:
  responses:
    ParsedCallDataResponse:
