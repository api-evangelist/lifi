aid: lifi
name: LI.FI
description: >-
  LI.FI is the routing and execution layer for cross-chain liquidity, payments,
  swaps and yield. A single integration gives an application access to more than
  100 aggregated bridges, DEXs, DEX aggregators and intent-based solvers across
  58+ chains spanning EVM, Solana, Bitcoin, SUI and TRON. The LI.FI API returns
  an optimal route plus a ready-to-sign, unsigned transaction; the product set
  extends to Composer for one-click DeFi deposits across 20+ protocols, Earn for
  yield discovery and portfolio tracking, an intent/solver marketplace built on
  the Open Intents Framework, an embeddable Widget, a TypeScript SDK, a CLI and
  a hosted MCP server for AI agents.
