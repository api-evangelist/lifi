apis:
- name: LI.FI Intents Order Server API
  description: >-
    Intent-based execution API for the LI.FI solver marketplace. Integrators request quotes and submit
    orders; solvers publish standing quote inventory and fill intents. Built on the Open Intents Framework
    and using EIP-7930 interoperable addresses. The integrator surface is open; the solver surface requires
    an api-key header.
  humanURL: https://docs.li.fi/lifi-intents/intents-api/api-overview
